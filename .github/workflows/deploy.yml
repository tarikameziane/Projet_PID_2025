name: Deploy Spring Boot Backend to Azure

on:
  push:
    branches: [ "main", "master" ]

env:
  ACR_NAME: "TON_ACR_NAME"             # Mets le nom de ton ACR généré au dessus
  WEBAPP_NAME: "TON_WEBAPP_NAME"       # Mets le nom de ton App Service
  RESOURCE_GROUP: "rg-backend-spring-prod"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Docker Login to ACR
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.ACR_NAME }}.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        IMAGE_URI="${{ env.ACR_NAME }}.azurecr.io/backend-spring:${{ github.sha }}"
        IMAGE_LATEST="${{ env.ACR_NAME }}.azurecr.io/backend-spring:latest"
        
        docker build -t $IMAGE_URI -t $IMAGE_LATEST .
        docker push $IMAGE_URI
        docker push $IMAGE_LATEST

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.WEBAPP_NAME }}
        images: '${{ env.ACR_NAME }}.azurecr.io/backend-spring:${{ github.sha }}'
